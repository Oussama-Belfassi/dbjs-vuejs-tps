<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TP2 - Formulaires & événements</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <h1>Catalogue de livres</h1>

    <!-- 1. Ajouter un livre : @submit.prevent évite le rechargement de la page -->
    <form @submit.prevent="ajouterLivre">
      <!-- Bonus : .trim sur title, .lazy sur author -->
      <input type="text" v-model.trim="newBook.title" placeholder="Titre" />
      <input type="text" v-model.lazy="newBook.author" placeholder="Auteur" />
      <input type="number" v-model.number="newBook.year" placeholder="Année" />

      <select v-model="newBook.genre">
        <option value="" disabled>Genre</option>
        <option>Génie logiciel</option>
        <option>Algorithmique</option>
        <option>Réseaux</option>
        <option>Autre</option>
      </select>

      <label><input type="checkbox" v-model="newBook.isFav" /> Favori</label>

      <!-- 5. Mots-clés au clavier -->
      <input
        type="text"
        v-model="nouveauMotCle"
        placeholder="Mot-clé + Entrée"
        @keydown.enter.prevent
        @keyup.enter="ajouterMotCle"
      />
      <div class="chips">
        <span class="chip" v-for="mot in newBook.keywords" :key="mot">
          {{ mot }}
          <button type="button" @click="retirerMotCle(mot)" aria-label="Retirer">×</button>
        </span>
      </div>

      <!-- 2. Validation : bouton désactivé tant que le formulaire n'est pas valide -->
      <button type="submit" :disabled="!formulaireValide">Ajouter</button>
    </form>

    <!-- 3 & 4. Supprimer + favori au clic sur la carte -->
    <div
      class="book"
      v-for="book in books"
      :key="book.id"
      :class="{ favori: book.isFav }"
      @click="toggleFavori(book)"
    >
      <h3>{{ book.title }} <span class="badge-favori" v-if="book.isFav">Favori</span></h3>
      <p>{{ book.author }} — {{ book.year }} — {{ book.genre }}</p>
      <div class="chips" v-if="book.keywords && book.keywords.length">
        <span class="chip" v-for="mot in book.keywords" :key="mot">{{ mot }}</span>
      </div>
      <!-- .stop : empêche le clic de "remonter" jusqu'à la carte (sinon toggleFavori serait aussi appelé) -->
      <button @click.stop="supprimerLivre(book)">Supprimer</button>
    </div>

    <p v-if="books.length === 0">Aucun livre dans le catalogue.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
